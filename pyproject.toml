[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caldav-mcp"
version = "0.1.0"
description = "Stateless multi-account CalDAV tools for local language models"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
  "mcp>=1.20,<2", "icalendar>=6,<8", "recurring-ical-events>=3,<4",
  "httpx>=0.28,<1", "defusedxml>=0.7,<1", "pydantic>=2.10,<3",
]

[project.scripts]
caldav-mcp = "caldav_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14", "mypy>=1.18", "types-defusedxml", "radicale>=3.5,<4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["icalendar.*", "recurring_ical_events.*"]
ignore_missing_imports = true
