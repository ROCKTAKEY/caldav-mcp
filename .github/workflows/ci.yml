name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.15'
      - parallel:
          - name: Verify workflow dependency lockfile
            env:
              GH_TOKEN: ${{ github.token }}
            run: |
              gh extension install github/gh-actions-lock --pin v0.4.1
              gh actions-lock --verify
          - name: Install test CalDAV server
            run: |
              uv venv --python 3.15 .venv
              uv pip install --python .venv/bin/python -r tests/requirements.txt
          - name: Formatting
            run: cargo fmt --all -- --check
          - name: Clippy
            run: cargo clippy --locked --all-targets -- -D warnings
      - parallel:
          - name: Agent plugin tests
            run: uv run --no-project --python 3.15 --with certifi -m unittest discover -s tests -p test_plugin.py
          - name: Unit, MCP and Radicale integration tests
            run: cargo test --locked --all-targets
          - name: Release build
            # Separate output directories avoid Cargo's build-directory lock.
            env:
              CARGO_TARGET_DIR: target-release
            run: cargo build --release --locked
