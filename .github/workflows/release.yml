name: Release binaries

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach binaries to
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        if: inputs.tag != ''
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install native musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build static binary
        env:
          CC: musl-gcc
        run: cargo build --release --locked --target "$TARGET"
      - name: Verify and package binary
        run: |
          binary="target/$TARGET/release/caldav-mcp"
          "$binary" --version
          "$binary" --help
          if readelf --program-headers "$binary" | grep -q INTERP; then
            echo 'Expected a static executable without a dynamic loader' >&2
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ]; then
            test "$("$binary" --version)" = "caldav-mcp ${RELEASE_TAG#v}"
          fi
          package="caldav-mcp-$TARGET"
          mkdir -p "dist/$package"
          cp "$binary" README.md LICENSE "dist/$package/"
          cp examples/config.toml "dist/$package/config.example.toml"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && inputs.tag != ''
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Attach archives and checksums to existing release
        working-directory: dist
        run: |
          gh release view "$RELEASE_TAG"
          sha256sum ./*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS
